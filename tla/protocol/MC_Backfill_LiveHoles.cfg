\* EXPECT pass: a reader that keeps polling what a scan skipped gets every box.
SPECIFICATION FairSpec
CONSTANTS
    Readers = {r1}
    N = 3
    MaxEpoch = 3
    Retention = 4
    StoredOp <- SpecStored
    NaiveAdopt = FALSE
    AckFurthest = FALSE
    AllowScan = TRUE
    KeepHoles = TRUE
PROPERTY DeliveryOnceScansStop

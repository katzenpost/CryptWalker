baseURL = "https://cryptlib.io/"
title = "CryptWalker"
locale = "en-US"
defaultContentLanguage = "en"
enableRobotsTXT = true

[module]
  proxy = "direct"
  [module.hugoVersion]
    extended = true
    min = "0.160.1"
  [[module.imports]]
    path = "github.com/docsy/docsy/theme"

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "A cryptographic library for Lean 4"
  github_repo = "https://github.com/katzenpost/CryptWalker"
  github_branch = "main"
  version = "main"
  copyright = "CryptWalker authors, AGPLv3"
  [params.ui]
    sidebar_menu_compact = true
    navbar_logo = false
  [params.links]
    [[params.links.developer]]
      name = "GitHub"
      url = "https://github.com/katzenpost/CryptWalker"
      icon = "fab fa-github"

[menu]
  [[menu.main]]
    name = "Overview"
    url = "/docs/overview/"
    weight = 10
  [[menu.main]]
    name = "Primitives"
    url = "/docs/primitives/"
    weight = 20
  [[menu.main]]
    name = "Getting started"
    url = "/docs/getting-started/"
    weight = 30
  [[menu.main]]
    name = "API"
    url = "/api/"
    weight = 40
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/katzenpost/CryptWalker"
    weight = 50
    pre = "<i class='fab fa-github'></i>"

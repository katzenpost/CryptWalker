\* EXPECT violated DeliveryOnceScansStop: a scan skips a box written while it runs, and nothing goes back for it.
SPECIFICATION FairSpec
CONSTANTS
    Readers = {r1}
    N = 3
    MaxEpoch = 3
    Retention = 4
    StoredOp <- SpecStored
    NaiveAdopt = FALSE
    AckFurthest = FALSE
    AllowScan = TRUE
    KeepHoles = FALSE
PROPERTY DeliveryOnceScansStop

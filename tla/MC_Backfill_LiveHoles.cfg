\* EXPECT pass: a reader that keeps polling what a scan skipped gets every box, even on the deployed replica.
SPECIFICATION FairSpec
CONSTANTS
    Readers = {r1}
    N = 3
    MaxEpoch = 3
    Retention = 4
    RefreshOnMatch = FALSE
    NaiveAdopt = FALSE
    AckFurthest = FALSE
    AllowScan = TRUE
    KeepHoles = TRUE
PROPERTY DeliveryOnceScansStop

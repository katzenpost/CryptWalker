\* EXPECT violated DeliveryOnceScansStop: a reader jumps over a box that is gone only until its owner's next rewrite, and rechecks it only when a scan runs.
SPECIFICATION FairSpec
CONSTANTS
    Readers = {r1, r2}
    N = 2
    MaxEpoch = 3
    Retention = 4
    StoredOp <- SpecStored
    AckFurthest = FALSE
    AutoScan = TRUE
    AllowScan = TRUE
    PollHoles = FALSE
    Window = 2
PROPERTY DeliveryOnceScansStop

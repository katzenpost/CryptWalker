\* EXPECT pass: a reader that polls what it jumped over until it reads it gets every box.
SPECIFICATION FairSpec
CONSTANTS
    Readers = {r1, r2}
    N = 2
    MaxEpoch = 3
    Retention = 4
    StoredOp <- SpecStored
    AckFurthest = FALSE
    AutoScan = TRUE
    AllowScan = TRUE
    PollHoles = TRUE
    Window = 2
PROPERTY DeliveryOnceScansStop

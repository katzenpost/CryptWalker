\* EXPECT pass: with the proposed scan and ack rules, boxes stay populated, nothing counts as read that was not, and no reader overshoots.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    N = 3
    MaxEpoch = 3
    Retention = 3
    StoredOp <- SpecStored
    NaiveAdopt = FALSE
    AckFurthest = FALSE
    AllowScan = TRUE
    KeepHoles = FALSE
SYMMETRY Symmetry
INVARIANTS TypeOK NoPrematureTombstone Populated NoSilentLoss NoOvershoot

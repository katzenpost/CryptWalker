\* EXPECT violated NoSilentLoss: an ack names the furthest box read, so a box a reader jumped over counts as read, and its owner may tombstone it.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    N = 3
    MaxEpoch = 3
    Retention = 3
    StoredOp <- SpecStored
    AckFurthest = TRUE
    AutoScan = TRUE
    AllowScan = TRUE
    PollHoles = FALSE
    Window = 3
SYMMETRY Symmetry
INVARIANTS TypeOK NoSilentLoss

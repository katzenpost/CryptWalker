\* EXPECT pass: with acks up to the unbroken run, boxes stay populated, nothing counts as read that was not, nothing is tombstoned early, and no reader overshoots.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    N = 3
    MaxEpoch = 3
    Retention = 3
    StoredOp <- SpecStored
    AckFurthest = FALSE
    AutoScan = TRUE
    AllowScan = TRUE
    PollHoles = FALSE
    Window = 3
SYMMETRY Symmetry
INVARIANTS TypeOK NoPrematureTombstone Populated NoSilentLoss NoOvershoot

name: Website

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "Makefile"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Reuse the .lake cache saved by Lean Action CI rather than storing another copy.
      # Lake rebuilds whatever changed, so an older commit's cache is still a good start.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - uses: actions/cache@v4
        with:
          path: docs/site/.lake
          key: verso-${{ hashFiles('docs/site/lean-toolchain', 'docs/site/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: verso-${{ hashFiles('docs/site/lean-toolchain', 'docs/site/lake-manifest.json') }}-
      - uses: actions/cache@v4
        with:
          path: docs/docbuild/.lake/apidocs/core-*
          key: core-docs-${{ hashFiles('lean-toolchain', 'docs/docbuild/lake-manifest.json') }}

      - name: Build the site
        env:
          CRYPTLIB_VERSION: ${{ github.head_ref || github.ref_name }}
        run: make website

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
